plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smsuserconsent'
version = '1.0.0'

android {
  namespace "expo.modules.smsuserconsent"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// Versions are the ones expo-image-picker (already in this build) and the Razorpay SDK (which brings play-services-auth-api-phone)
// resolve, so nothing new has to be downloaded.
dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  implementation "com.google.android.gms:play-services-auth-api-phone:18.0.2"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
}
